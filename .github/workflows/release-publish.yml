name: Release - publish

# Fires when a release-X.Y.Z PR (opened by release-prepare.yml) is merged.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Tag and create draft releases
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${BRANCH#release-}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad branch: $BRANCH"; exit 1; }
          sha=$(git rev-parse HEAD)

          prev_plugins=$(git tag --list 'v*' --sort=-v:refname | head -1)
          prev_flowrite=$(git tag --list 'flowrite-v*' --sort=-v:refname | head -1)

          release() {
            local tag="$1" title="$2" prev="$3"
            args=(--target "$sha" --title "$title" --generate-notes --draft)
            [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
            gh release create "$tag" "${args[@]}"
          }

          release "v$version" "ZIO Skills v$version" "$prev_plugins"
          release "flowrite-v$version" "flowrite v$version" "$prev_flowrite"
